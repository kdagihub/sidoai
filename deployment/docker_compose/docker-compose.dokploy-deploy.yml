# Fusion prod-no-letsencrypt + dokploy, sans directive `include`.
# Dokploy valide les domaines sur ce fichier seul : il ne voit pas les services dans docker-compose.dokploy-entry.yml.
# Compose Path Dokploy : deployment/docker_compose/docker-compose.dokploy-deploy.yml
# Ne pas régénérer avec `docker compose config` sans préserver ${ONYX_*}: sinon les images sont résolues en dur (onyxdotapp/...).
# AUTH : `basic` figé ici pour éviter qu’un AUTH_TYPE=oidc injecté côté Dokploy (sans
# OPENID_CONFIG_URL) fasse crasher l’API. Pour OIDC : retirez cette ligne du compose
# ou surchargez via overlay et renseignez OPENID_CONFIG_URL + OAUTH_* .
#
name: sido
services:
  api_server:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && echo "Starting Onyx Api Server" && uvicorn onyx.main:app --host 0.0.0.0 --port 8080
    depends_on:
      cache:
        condition: service_started
        required: true
      inference_model_server:
        condition: service_started
        required: true
      minio:
        condition: service_started
        required: true
      opensearch:
        condition: service_started
        required: true
      relational_db:
        condition: service_healthy
        required: true
    environment:
      AUTH_TYPE: basic
      # Build CE sans packages ee.* : le défaut upstream (true) active « EE mode » et
      # fait échouer fetch_ee_implementation_or_noop sur des imports manquants.
      LICENSE_ENFORCEMENT_ENABLED: "false"
      AWS_ACCESS_KEY_ID: ""
      AWS_REGION_NAME: ""
      AWS_SECRET_ACCESS_KEY: ""
      CODE_INTERPRETER_BASE_URL: http://code-interpreter:8000
      ENABLE_OPENSEARCH_INDEXING_FOR_ONYX: "true"
      ENABLE_OPENSEARCH_RETRIEVAL_FOR_ONYX: "true"
      MODEL_SERVER_HOST: inference_model_server
      ONYX_DISABLE_VESPA: "true"
      OPENSEARCH_ADMIN_PASSWORD: StrongPassword123!
      OPENSEARCH_HOST: opensearch
      PERSISTENT_DOCUMENT_STORAGE_PATH: /app/file-system
      POSTGRES_HOST: relational_db
      REDIS_HOST: cache
      S3_AWS_ACCESS_KEY_ID: minioadmin
      S3_AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio:9000
      USE_IAM_AUTH: ""
    extra_hosts:
      - host.docker.internal=host-gateway
    image: ${ONYX_BACKEND_IMAGE:-onyxdotapp/onyx-backend:${IMAGE_TAG:-latest}}
    logging:
      driver: json-file
      options:
        max-file: "6"
        max-size: 50m
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: api_server_logs
        target: /var/log/onyx
        volume: {}
      - type: volume
        source: file-system
        target: /app/file-system
        volume: {}
  background:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command:
      - /app/scripts/supervisord_entrypoint.sh
    depends_on:
      cache:
        condition: service_started
        required: true
      indexing_model_server:
        condition: service_started
        required: true
      inference_model_server:
        condition: service_started
        required: true
      opensearch:
        condition: service_started
        required: true
      relational_db:
        condition: service_healthy
        required: true
    environment:
      AUTH_TYPE: basic
      # Build CE sans packages ee.* : le défaut upstream (true) active « EE mode » et
      # fait échouer fetch_ee_implementation_or_noop sur des imports manquants.
      LICENSE_ENFORCEMENT_ENABLED: "false"
      AWS_ACCESS_KEY_ID: ""
      AWS_REGION_NAME: ""
      AWS_SECRET_ACCESS_KEY: ""
      ENABLE_OPENSEARCH_INDEXING_FOR_ONYX: "true"
      ENABLE_OPENSEARCH_RETRIEVAL_FOR_ONYX: "true"
      INDEXING_MODEL_SERVER_HOST: indexing_model_server
      MODEL_SERVER_HOST: inference_model_server
      ONYX_DISABLE_VESPA: "true"
      OPENSEARCH_ADMIN_PASSWORD: StrongPassword123!
      OPENSEARCH_HOST: opensearch
      PERSISTENT_DOCUMENT_STORAGE_PATH: /app/file-system
      POSTGRES_HOST: relational_db
      REDIS_HOST: cache
      S3_AWS_ACCESS_KEY_ID: minioadmin
      S3_AWS_SECRET_ACCESS_KEY: minioadmin
      S3_ENDPOINT_URL: http://minio:9000
      USE_IAM_AUTH: ""
    extra_hosts:
      - host.docker.internal=host-gateway
    image: ${ONYX_BACKEND_IMAGE:-onyxdotapp/onyx-backend:${IMAGE_TAG:-latest}}
    logging:
      driver: json-file
      options:
        max-file: "6"
        max-size: 50m
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: background_logs
        target: /var/log/onyx
        volume: {}
      - type: volume
        source: file-system
        target: /app/file-system
        volume: {}
  cache:
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
    image: redis:7.4-alpine
    networks:
      default: null
    restart: unless-stopped
    tmpfs:
      - /data
  code-interpreter:
    command:
      - bash
      - ./entrypoint.sh
      - code-interpreter-api
    image: ${CODE_INTERPRETER_IMAGE:-onyxdotapp/code-interpreter:${CODE_INTERPRETER_IMAGE_TAG:-latest}}
    networks:
      default: null
    restart: unless-stopped
    user: root
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        bind: {}
  # Vespa est lourd (RAM/CPU) et lent au boot ; avec OpenSearch activé, ONYX_DISABLE_VESPA
  # évite d’en dépendre. Profil optionnel : COMPOSE_PROFILES=vespa docker compose ... up
  index:
    profiles:
      - vespa
    environment:
      VESPA_SKIP_UPGRADE_CHECK: "true"
    image: vespaengine/vespa:8.609.39
    logging:
      driver: json-file
      options:
        max-file: "6"
        max-size: 50m
    networks:
      default: null
    ports:
      - mode: ingress
        target: 19071
        published: "19071"
        protocol: tcp
      - mode: ingress
        target: 8081
        published: "8081"
        protocol: tcp
    restart: unless-stopped
    volumes:
      - type: volume
        source: vespa_volume
        target: /opt/vespa/var
        volume: {}
  indexing_model_server:
    build:
      context: ../../backend
      dockerfile: Dockerfile.model_server
    command:
      - /bin/sh
      - -c
      - |-
        if [ "" = "True" ] || [ "" = "true" ]; then
          echo 'Skipping service...';
          exit 0;
        else
          exec uvicorn model_server.main:app --host 0.0.0.0 --port 9000;
        fi
    environment:
      INDEXING_ONLY: "True"
      LOG_LEVEL: info
      MIN_THREADS_ML_MODELS: ""
      VESPA_SEARCHER_THREADS: "1"
    image: ${ONYX_MODEL_SERVER_IMAGE:-onyxdotapp/onyx-model-server:${IMAGE_TAG:-latest}}
    logging:
      driver: json-file
      options:
        max-file: "6"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
    volumes:
      - type: volume
        source: indexing_huggingface_model_cache
        target: /app/.cache/huggingface
        volume: {}
      - type: volume
        source: indexing_model_server_logs
        target: /var/log/onyx
        volume: {}
  inference_model_server:
    build:
      context: ../../backend
      dockerfile: Dockerfile.model_server
    command:
      - /bin/sh
      - -c
      - |-
        if [ "" = "True" ] || [ "" = "true" ]; then
          echo 'Skipping service...';
          exit 0;
        else
          exec uvicorn model_server.main:app --host 0.0.0.0 --port 9000;
        fi
    environment:
      LOG_LEVEL: info
      MIN_THREADS_ML_MODELS: ""
    image: ${ONYX_MODEL_SERVER_IMAGE:-onyxdotapp/onyx-model-server:${IMAGE_TAG:-latest}}
    logging:
      driver: json-file
      options:
        max-file: "6"
        max-size: 50m
    networks:
      default: null
    restart: on-failure
    volumes:
      - type: volume
        source: model_cache_huggingface
        target: /app/.cache/huggingface
        volume: {}
      - type: volume
        source: inference_model_server_logs
        target: /var/log/onyx
        volume: {}
  minio:
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_DEFAULT_BUCKETS: onyx-file-store-bucket
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ROOT_USER: minioadmin
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      timeout: 20s
      interval: 30s
      retries: 3
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: volume
        source: minio_data
        target: /data
        volume: {}
  nginx:
    command:
      - /bin/sh
      - -c
      - rm -f /etc/nginx/conf.d/default.conf && cp -a /nginx-templates/. /etc/nginx/conf.d/ && sed 's/r$$//' /etc/nginx/conf.d/run-nginx.sh > /tmp/run-nginx.sh && chmod +x /tmp/run-nginx.sh && /tmp/run-nginx.sh app.conf.template.http-only
    depends_on:
      api_server:
        condition: service_started
        required: true
      web_server:
        condition: service_started
        required: true
    environment:
      NGINX_PROXY_CONNECT_TIMEOUT: "300"
      NGINX_PROXY_READ_TIMEOUT: "300"
      NGINX_PROXY_SEND_TIMEOUT: "300"
    image: nginx:1.25.5-alpine
    logging:
      driver: json-file
      options:
        max-file: "6"
        max-size: 50m
    networks:
      default: null
    restart: unless-stopped
    volumes:
      - type: bind
        source: ../data/nginx
        target: /nginx-templates
        read_only: true
        bind: {}
      - type: bind
        source: ../data/sslcerts
        target: /etc/nginx/sslcerts
        bind: {}
  opensearch:
    environment:
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: StrongPassword123!
      OPENSEARCH_JAVA_OPTS: -Xms2g -Xmx2g
      bootstrap.memory_lock: "true"
      discovery.type: single-node
    image: opensearchproject/opensearch:3.4.0
    logging:
      driver: json-file
      options:
        max-file: "6"
        max-size: 50m
    networks:
      default: null
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - type: volume
        source: opensearch-data
        target: /usr/share/opensearch/data
        volume: {}
  relational_db:
    command:
      - -c
      - max_connections=250
    # Même identifiants que l’app (env Dokploy / .env). Sans ça, Postgres crée seulement
    # l’utilisateur par défaut alors que le healthcheck pouvait viser un autre POSTGRES_USER
    # interpolé côté hôte → pg_isready en échec permanent (unhealthy).
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    # CMD + interpolation Compose (mêmes défauts que `environment`) : évite CMD-SHELL et $$ mal échappés.
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "localhost",
          "-U",
          "${POSTGRES_USER:-postgres}",
          "-d",
          "${POSTGRES_DB:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 90s
    image: postgres:15.2-alpine
    logging:
      driver: json-file
      options:
        max-file: "6"
        max-size: 50m
    networks:
      default: null
    restart: unless-stopped
    shm_size: "1073741824"
    volumes:
      - type: volume
        source: db_volume
        target: /var/lib/postgresql/data
        volume: {}
  web_server:
    build:
      context: ../../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DISABLE_LOGOUT: ""
        NEXT_PUBLIC_THEME: ""
    depends_on:
      api_server:
        condition: service_started
        required: true
    environment:
      INTERNAL_URL: http://api_server:8080
    image: ${ONYX_WEB_SERVER_IMAGE:-onyxdotapp/onyx-web-server:${IMAGE_TAG:-latest}}
    logging:
      driver: json-file
      options:
        max-file: "6"
        max-size: 50m
    networks:
      default: null
    restart: unless-stopped
networks:
  default:
    name: sido_default
volumes:
  api_server_logs:
    name: sido_api_server_logs
  background_logs:
    name: sido_background_logs
  db_volume:
    name: sido_db_volume
  file-system:
    name: sido_file-system
  indexing_huggingface_model_cache:
    name: sido_indexing_huggingface_model_cache
  indexing_model_server_logs:
    name: sido_indexing_model_server_logs
  inference_model_server_logs:
    name: sido_inference_model_server_logs
  minio_data:
    name: sido_minio_data
  model_cache_huggingface:
    name: sido_model_cache_huggingface
  opensearch-data:
    name: sido_opensearch-data
  vespa_volume:
    name: sido_vespa_volume
